[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-local"
version = "0.1.0"
description = "A local-first AI model runner"
requires-python = ">=3.10"
dependencies = ["huggingface_hub","transformers","torch"]

[project.scripts]
orbit = "main:main"

[tool.setuptools]
py-modules = ["main"]