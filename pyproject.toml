[build-systems]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-local"
version = "0.1.0"
description = "A local first model runner"
requires-python = ">=3.10"
dependencies = ["requests"]

[project.scripts]
orbit = "main : main"

[tool.setuptools]
py-modules = ["main"]